<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JIRAMA - Suivi des consommations</title>

    <script>
      (function () {
        var sombre = false;
        try {
          var choix = localStorage.getItem('jirama-theme');
          if (choix === 'sombre' || choix === 'clair') {
            sombre = choix === 'sombre';
          } else {
            sombre = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
        } catch (e) {
          try {
            sombre = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e2) {}
        }
        if (sombre) document.documentElement.classList.add('dark');
        try {
          var taille = localStorage.getItem('jirama-display-size');
          if (taille === 'grand') document.documentElement.classList.add('jr-font-grand');
          if (taille === 'presentation') document.documentElement.classList.add('jr-presentation-mode');
        } catch (e3) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
